name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: maryam-sy/shopsn-ecommerce

jobs:

  # ─────────────────────────────────────────────
  # 1. Qualité de code : installation + lint
  # ─────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer le lint
        run: npm run lint


  # ─────────────────────────────────────────────
  # 2. Tests unitaires
  # ─────────────────────────────────────────────
  test:
    name: Tests unitaires
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests
        run: npm test -- --watch=false


  # ─────────────────────────────────────────────
  # 3. Build de l'application Angular
  # ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Build production
        run: npm run build -- --configuration production

      - name: Sauvegarder le build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7


  # ─────────────────────────────────────────────
  # 4. Sécurité — audit des dépendances npm
  # ─────────────────────────────────────────────
  security-deps:
    name: Scan dépendances (npm audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Audit des dépendances
        run: npm audit --audit-level=high


  # ─────────────────────────────────────────────
  # 5. Sécurité — détection des secrets
  # ─────────────────────────────────────────────
  security-secrets:
    name: Scan secrets (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ─────────────────────────────────────────────
  # 6. Build & push de l'image Docker vers GHCR
  # ─────────────────────────────────────────────
  docker-build-push:
    name: Build & push image Docker
    runs-on: ubuntu-latest

    needs:
      - build
      - security-deps
      - security-secrets

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # Configuration de Docker Buildx
      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Connexion à GitHub Container Registry
      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Génération des métadonnées Docker
      - name: Extraction des métadonnées
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      # Construction et publication
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          # Cache GitHub Actions
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ─────────────────────────────────────────────
  # 7. Sécurité — scan de l'image Docker avec Trivy
  # ─────────────────────────────────────────────
  security-image:
    name: Scan image Docker (Trivy)
    runs-on: ubuntu-latest

    needs:
      - docker-build-push

    permissions:
      contents: read
      packages: read

    steps:
      # Connexion à GHCR pour permettre à Trivy
      # d'accéder à l'image publiée
      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Scan de sécurité
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/maryam-sy/shopsn-ecommerce:latest
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'