name: CI/CD - E-Commerce DevSecOps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ github.repository_owner }}/ecommerce-frontend
  REGISTRY: ghcr.io

jobs:
  lint-test:
    name: Lint & Tests unitaires
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dependances
        run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Tests unitaires + couverture
        run: npm run test:coverage
      - name: Uploader le rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: frontend/coverage

  dependency-scan:
    name: Scan des dependances (SCA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high

  secret-scan:
    name: Scan des secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Analyse statique (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  build-image:
    name: Build & scan image Docker
    runs-on: ubuntu-latest
    needs: [lint-test, dependency-scan, secret-scan, sast]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build de l'image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          push: false
          load: true
      - name: Scan de vulnerabilites (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
      - name: Connexion au registre
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publier l'image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploiement (staging)
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Deployer via SSH / plateforme cible
        run: |
          echo "Etape a adapter selon la cible reelle"